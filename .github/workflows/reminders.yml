name: Run daily study reminders

on:
  schedule:
    # 18:00 UTC daily — evening check for "did today's promised session happen".
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    env:
      GCP_REGION: asia-northeast1
      BACKEND_SERVICE: edufx-backend
      BACKEND_URL: ${{ secrets.BACKEND_URL || vars.BACKEND_URL }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      HAS_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      REMINDERS_SHARED_SECRET: ${{ secrets.REMINDERS_SHARED_SECRET }}
    steps:
      - name: Validate reminder configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${BACKEND_URL:-}" && ! "${BACKEND_URL}" =~ ^https?:// ]]; then
            echo "::error title=Invalid BACKEND_URL::BACKEND_URL must start with http:// or https://"
            exit 1
          fi

          if [[ -z "${REMINDERS_SHARED_SECRET:-}" ]]; then
            echo "::error title=Missing REMINDERS_SHARED_SECRET secret::Set REMINDERS_SHARED_SECRET to the same value deployed in the backend Cloud Run service"
            exit 1
          fi

          if [[ -z "${BACKEND_URL:-}" ]]; then
            if [[ -z "${GCP_PROJECT_ID:-}" || "${HAS_GCP_SA_KEY}" != "true" ]]; then
              echo "::error title=Missing backend target::Set BACKEND_URL, or set GCP_PROJECT_ID and GCP_SA_KEY so the workflow can discover the Cloud Run backend URL"
              exit 1
            fi
            echo "BACKEND_URL was not set; resolving ${BACKEND_SERVICE} from Cloud Run."
          fi

      - id: auth
        if: ${{ env.BACKEND_URL == '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - if: ${{ env.BACKEND_URL == '' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve backend URL
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${BACKEND_URL:-}" ]]; then
            resolved_url="${BACKEND_URL%/}"
          else
            resolved_url="$(gcloud run services describe "${BACKEND_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format='value(status.url)')"
          fi

          if [[ -z "${resolved_url:-}" || ! "${resolved_url}" =~ ^https?:// ]]; then
            echo "::error title=Backend URL not resolved::Could not resolve a valid backend URL for the reminder scan"
            exit 1
          fi

          echo "NORMALIZED_BACKEND_URL=${resolved_url%/}" >> "$GITHUB_ENV"

      - name: Trigger reminder scan
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --connect-timeout 20 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 2 \
            -X POST "${NORMALIZED_BACKEND_URL}/internal/reminders/run" \
            -H "X-Internal-Secret: ${REMINDERS_SHARED_SECRET}"
