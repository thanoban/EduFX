name: Run daily study reminders

on:
  schedule:
    # 18:00 UTC daily — evening check for "did today's promised session happen".
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder scan
        run: |
          curl --fail -X POST "${{ secrets.BACKEND_URL }}/internal/reminders/run" \
            -H "X-Internal-Secret: ${{ secrets.REMINDERS_SHARED_SECRET }}"
